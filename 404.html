<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Danyil Kushnir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#f4f7f5; --muted:#9aada5; --green:#b6ff55; --deep:#071612; --line:rgba(214,239,221,.18); }
      * { box-sizing:border-box; }
      body { min-width:320px; min-height:100vh; margin:0; overflow:hidden; color:var(--ink); background:var(--deep); font-family:Manrope,Arial,sans-serif; }
      .shell { width:min(1180px,calc(100% - 48px)); height:100vh; margin:auto; display:flex; flex-direction:column; }
      nav { height:86px; flex:none; display:flex; align-items:center; border-bottom:1px solid var(--line); }
      .brand { color:var(--ink); text-decoration:none; font:500 13px 'DM Mono',monospace; letter-spacing:.04em; }
      .brand span { color:var(--green); }
      main { position:relative; flex:1; display:flex; align-items:center; overflow:hidden; }
      main:before,main:after { content:""; position:absolute; border:1px solid var(--line); border-radius:50%; pointer-events:none; }
      main:before { width:min(72vw,800px); height:min(72vw,800px); right:-20vw; top:-26vw; }
      main:after { width:min(53vw,590px); height:min(53vw,590px); right:-10vw; top:-16vw; border-color:rgba(182,255,85,.18); }
      .content { position:relative; z-index:1; }
      .code { margin-bottom:17px; color:var(--green); font:500 13px 'DM Mono',monospace; letter-spacing:.12em; }
      h1 { max-width:740px; margin:0; font-size:clamp(65px,11vw,148px); line-height:.82; letter-spacing:-.09em; font-weight:800; }
      h1 span { color:var(--green); }
      p { max-width:460px; margin:31px 0 29px; color:var(--muted); font-size:16px; line-height:1.7; }
      .back { display:inline-flex; align-items:center; gap:12px; padding:13px 17px; color:var(--deep); background:var(--green); text-decoration:none; font:700 12px 'DM Mono',monospace; transition:transform .2s,background .2s; }
      .back:hover { transform:translate(-3px,-3px); background:#d0ff91; }
      footer { padding:26px 0 35px; border-top:1px solid var(--line); color:var(--muted); font:12px 'DM Mono',monospace; }
      @media (max-width:600px) { .shell { width:calc(100% - 34px); } nav { height:70px; } h1 { font-size:clamp(63px,23vw,100px); } main:before { width:550px; height:550px; right:-330px; top:-100px; } main:after { width:380px; height:380px; right:-240px; top:-14px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav><a class="brand" href="/">DANYIL<span>/</span>KUSHNIR</a></nav>
      <main>
        <div class="content">
          <div class="code">ERROR / PAGE NOT FOUND</div>
          <h1>Lost in<br />the <span>grid.</span></h1>
          <p>The page you’re looking for doesn’t exist, may have moved, or the link may be incorrect.</p>
          <a class="back" href="/">← RETURN HOME</a>
        </div>
      </main>
      <footer>404 / DANYIL KUSHNIR / FRONTEND DEVELOPER</footer>
    </div>
  </body>
</html>
